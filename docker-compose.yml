services:
  neo4j:
    image: neo4j:5-community
    container_name: blog_neo4j
    environment:
      # Usuario/contraseña de Neo4j (mínimo 8 caracteres). Debe coincidir con app/db.py
      NEO4J_AUTH: neo4j/admin12345
      # Las fechas (datetime()) se guardan con la hora de Chihuahua
      NEO4J_db_temporal_timezone: America/Chihuahua
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt: puerto que usa Python
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p admin12345 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  neo4j_data:
